<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Merriweather', Georgia, serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 2em;
        }
        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2em;
            color: #1a1a1a;
            margin-bottom: 0.5em;
        }
        .intro {
            color: #666;
            margin-bottom: 2em;
        }
        .listing {
            list-style: none;
            padding: 0;
        }
        .listing-item {
            margin: 1.5em 0;
            padding-bottom: 1.5em;
            border-bottom: 1px solid #eee;
        }
        .listing-item:last-child {
            border-bottom: none;
        }
        .listing-item a {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.3em;
            color: #1a1a1a;
            text-decoration: none;
        }
        .listing-item a:hover {
            color: #0066cc;
        }
        .listing-meta {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85em;
            color: #888;
            margin-top: 0.25em;
        }
        footer {
            margin-top: 3em;
            padding-top: 1em;
            border-top: 1px solid #ddd;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75em;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Newsletter Archive</h1>
    <p class="intro">Below are all the newsletters I've published. Subscribe to receive future newsletters directly in your inbox.</p>
    <ul class="listing">
        <li class="listing-item">
            <a href="../1_first_newsletter/">First Newsletter</a>
            <span class="listing-meta">Issue #1 — 2026-08-05</span>
        </li>
    </ul>
    <footer>
        <p>&copy; 2026 Jawad A. Khan</p>
    </footer>
</body>
</html>
