<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Newsletter</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <style>
        /* Email-safe inline styles based on existing CSS */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Merriweather', Georgia, serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .newsletter-container {
            padding: 2em;
            background-color: #fff;
        }
        
        .newsletter-header {
            border-bottom: 2px solid #333;
            padding-bottom: 1em;
            margin-bottom: 2em;
        }
        
        .newsletter-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.8em;
            line-height: 1.2;
            margin: 0;
            color: #1a1a1a;
        }
        
        .newsletter-meta {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85em;
            color: #666;
            margin-top: 0.5em;
        }
        
        .newsletter-content {
            font-size: 1em;
            line-height: 1.7;
        }
        
        .newsletter-content h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.5em;
            margin-top: 1.5em;
            margin-bottom: 0.75em;
            color: #1a1a1a;
        }
        
        .newsletter-content h2 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.3em;
            margin-top: 1.25em;
            margin-bottom: 0.5em;
            color: #2a2a2a;
        }
        
        .newsletter-content h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1em;
            font-weight: 600;
            margin-top: 1em;
            margin-bottom: 0.5em;
        }
        
        .newsletter-content p {
            margin: 1em 0;
        }
        
        .newsletter-content ul,
        .newsletter-content ol {
            margin: 1em 0;
            padding-left: 1.5em;
        }
        
        .newsletter-content li {
            margin: 0.5em 0;
        }
        
        .newsletter-content blockquote {
            border-left: 3px solid #333;
            margin: 1.5em 0;
            padding-left: 1em;
            font-style: italic;
            color: #555;
        }
        
        .newsletter-content a {
            color: #0066cc;
            text-decoration: underline;
        }
        
        .newsletter-footer {
            border-top: 1px solid #ddd;
            margin-top: 2em;
            padding-top: 1em;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75em;
            color: #888;
            text-align: center;
        }
        
        .newsletter-footer a {
            color: #888;
        }
    </style>
</head>
<body>
    <div class="newsletter-container">
        <header class="newsletter-header">
            <h1 class="newsletter-title">{{ title }}</h1>
            <div class="newsletter-meta">
                {{ date }}
            </div>
        </header>
        
        <main class="newsletter-content">
            {{ content }}
        </main>
        
        <footer class="newsletter-footer">
            <p>&copy; {{ year }} Jawad A. Khan</p>
            <p>You're receiving this because you subscribed to the newsletter.</p>
            <p><a href="{{ unsubscribe_url }}">Unsubscribe</a></p>
        </footer>
    </div>
</body>
</html>
